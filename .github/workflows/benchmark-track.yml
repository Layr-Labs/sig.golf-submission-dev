name: Verify an ots.golf track
on:
  workflow_call:
    inputs:
      track:
        required: true
        type: string
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 90
    steps:
      - name: Checkout dispatched commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false
      - name: Setup benchmark
        run: bash .yukon/blacksmith.sh setup
      - name: Benchmark
        env:
          TRACK: ${{ inputs.track }}
        run: bash .yukon/blacksmith.sh run "$TRACK"
      - name: Collect results
        if: always()
        run: bash .yukon/blacksmith.sh collect
      - name: Upload score
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: score-${{ inputs.track }}
          path: benchmark-results/${{ inputs.track }}/score.json
          if-no-files-found: error
      - name: Upload verdict
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: verdict-${{ inputs.track }}
          path: benchmark-results/${{ inputs.track }}/verdict.json
          if-no-files-found: ignore
      - name: Stop verifier VM
        if: always()
        run: bash .yukon/blacksmith.sh stop
